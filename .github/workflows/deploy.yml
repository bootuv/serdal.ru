name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не даём двум деплоям идти одновременно, очередь не отменяем.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /var/www/serdal.ru

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Проверить, что секреты заданы
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Пустые секреты:$missing — заведите их в Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi
          echo "Все секреты на месте (длина ключа: ${#SSH_PRIVATE_KEY} симв.)"

      # CSS кабинетов собирается только из наших шаблонов (tailwind.cabinet.config.js) — PHP-зависимости не нужны.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости фронтенда
        run: npm ci

      # Vite запекает VITE_* в бандл при сборке. В CI нет серверного .env, поэтому
      # значения для Reverb (WebSocket) берутся из Settings → Secrets and variables →
      # Actions → Variables. Без них Echo не создаётся (см. resources/js/echo.js):
      # сайт работает, но чат и realtime-уведомления — нет.
      - name: Собрать ассеты
        env:
          VITE_REVERB_APP_KEY: ${{ vars.VITE_REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ vars.VITE_REVERB_HOST }}
          VITE_REVERB_PORT: ${{ vars.VITE_REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ vars.VITE_REVERB_SCHEME }}
        run: |
          if [ -z "$VITE_REVERB_APP_KEY" ]; then
            echo "::warning::VITE_REVERB_APP_KEY не задан в Actions → Variables — в сборке не будет WebSocket (Reverb)"
          fi
          npm run build

      - name: Проверить, что сборка не пустая
        run: |
          test -f public/build/manifest.json
          css=$(find public/build/assets -name 'cabinet-*.css' -print -quit)
          [ -n "$css" ] || { echo "::error::Нет CSS кабинетов в сборке"; exit 1; }
          size=$(wc -c < "$css")
          echo "CSS: $css, $size байт"
          # CSS кабинетов — ~30 КБ. Если Tailwind не нашёл шаблоны, файл будет почти пустым.
          [ "$size" -ge 15000 ] || { echo "::error::CSS подозрительно мал — вероятно, Tailwind не нашёл шаблоны кабинетов"; exit 1; }

      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Залить ассеты на сервер
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/id_deploy -p $SSH_PORT"
          TARGET="$APP_DIR/builds/${{ github.sha }}"
          $SSH_CMD "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET'"
          rsync -az --delete -e "$SSH_CMD" \
            public/build/ "$SSH_USER@$SSH_HOST:$TARGET/"

      - name: Деплой по SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          PHP_FPM: ${{ vars.PHP_FPM || 'php8.4-fpm' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' \
             BRANCH='${{ github.ref_name }}' \
             PHP_FPM='$PHP_FPM' \
             ASSETS_SHA='${{ github.sha }}' \
             bash -s" < deploy.sh

      - name: Проверить, что сайт отвечает
        run: |
          for i in 1 2 3; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 https://serdal.ru/ || true)
            echo "Попытка $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Сайт не отвечает 200 после деплоя"
          exit 1
