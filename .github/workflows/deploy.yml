name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не даём двум деплоям идти одновременно, очередь не отменяем.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Деплой по SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ vars.APP_DIR || '/var/www/serdal.ru' }}
          PHP_FPM: ${{ vars.PHP_FPM || 'php8.4-fpm' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' BRANCH='${{ github.ref_name }}' PHP_FPM='$PHP_FPM' bash -s" < deploy.sh

      - name: Проверить, что сайт отвечает
        run: |
          for i in 1 2 3; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 https://serdal.ru/ || true)
            echo "Попытка $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Сайт не отвечает 200 после деплоя"
          exit 1
