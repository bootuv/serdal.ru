; /etc/php/8.4/fpm/conf.d/99-serdal.ini
; В проекте ~47 тыс. PHP-файлов (Filament), дефолтные 10000 файлов / 128 МБ / 8 МБ строк малы.
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
; validate_timestamps=0 уже задан в системе: после деплоя обязателен перезапуск php-fpm (deploy.sh это делает)
expose_php=Off
; Загрузки до 200 МБ (видео в новостях — config/livewire.php temporary_file_upload)
upload_max_filesize=210M
post_max_size=220M
