# /etc/nginx/conf.d/serdal-tuning.conf — общие (http-level) настройки.
# По умолчанию nginx сжимает только text/html: CSS и JS уходили несжатыми.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/xml application/xml+rss application/manifest+json image/svg+xml font/ttf font/otf;

server_tokens off;
