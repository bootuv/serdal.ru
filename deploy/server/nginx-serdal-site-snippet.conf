# /etc/nginx/snippets/serdal-static.conf — подключается в server{} сайта serdal.ru (443):
#     include snippets/serdal-static.conf;

# Ассеты Vite содержат хеш в имени — их можно кешировать «навсегда»
location /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}

location ~* ^/(images|css|js|sounds|defaults)/.+\.(?:png|jpe?g|gif|webp|svg|ico|css|js|woff2?|mp3|ogg)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff";
    access_log off;
    try_files $uri =404;
}
